[project]
name = "enterprise-rag-agent"
version = "0.1.0"
description = "Production-grade agentic RAG system for enterprise knowledge management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "litellm>=1.50",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "psycopg[binary,pool]>=3.2",
    "slowapi>=0.1.9",
    "starlette>=1.3.1",
    "langsmith>=0.8.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "types-beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
markers = ["integration: marks tests that require live Docker services"]

[tool.bandit]
skips = ["B101"]
